docker_registry:
  base_url: "ext-artifactory.denglin.com:8082"
  namespace: "ci-docker-images"

docker_images:
  x86_64:
    image: "c-29:manylinux_2_28-gcc12-amd64-20250703"
    dev_image: "c-29:manylinux_2_28-gcc12-amd64-20250703-dev"
  aarch64:
    image: "c-25:manylinux_2_28-gcc12-aarch64-20250702"
    dev_image: "c-25:manylinux_2_28-gcc12-aarch64-20250702-dev"
  riscv64:
    image: "c-40:manylinux_2_39-riscv64-20250911"
    dev_image: "c-40:manylinux_2_39-riscv64-20250911"
  loongarch64:
    image: "c-41:manylinux_2_38-loongarch64-20250910"
    dev_image: "c-41:manylinux_2_38-loongarch64-20250910"
  android:
    image: "c-39:android-ndk25.2-jdk22-amd64-20251204"
    dev_image: "c-39:android-ndk25.2-jdk22-amd64-20251204"

platform_suffixes:
  x86_64: "manylinux_2_28-x86_64"
  aarch64: "manylinux_2_28-aarch64"
  riscv64: "manylinux_2_39-riscv64"
  loongarch64: "manylinux_2_38-loongarch64"
  android: "android-arm64-v8a-api25"

build:
  sdk:
    tag: "V2_SOFTWARE_master_202601191452"
    workspace_template: "${CI_BUILDS_DIR}/sdk_llama_cpp/${DOCKER_PLATFORM}/${SDK_TAG}"
    docker_REPO_PATH: "${CI_BUILDS_DIR}/sdk_llama_cpp/docker"

    # SDK download configuration
    download:
      x86_64:
        repository: "sw-master-sdk-MR/v2/test"
        filename_pattern: "*manylinux_2_28-x86_64-test.tar.xz"
        extract_dir: "sdk"
      aarch64:
        repository: "sw-master-sdk-MR/v2/test"
        filename_pattern: "*manylinux_2_28-aarch64-test.tar.xz"
        extract_dir: "sdk"
      riscv64:
        repository: "sw-master-sdk-MR/v2/test"
        filename_pattern: "*ubuntu24.04-riscv64-test.tar.xz"
        extract_dir: "sdk"
      loongarch64:
        repository: "sw-master-sdk-MR/v2/test"
        filename_pattern: "*manylinux_2_38-loongarch64-test.tar.xz"
        extract_dir: "sdk"
      android:
        # Android cross-compilation dual SDK configuration
        # x86 SDK for compilation, aarch64 SDK for linking
        x86_sdk:
          repository: "sw-master-sdk-MR/v2/test"
          filename_pattern: "*manylinux_2_28-x86_64-test.tar.xz"
          extract_dir: "sdk"
        aarch64_sdk:
          repository: "sw-master-sdk-MR/v2/test"
          filename_pattern: "*manylinux_2_28-aarch64-test.tar.xz"
          extract_dir: "sdk_aarch64"

  model_path: "/mars/aebox/LLM/model"

  build_dirs:
    x86_64: "build_x86_64/bin"
    aarch64: "build_aarch64/bin"
    riscv64: "build_riscv64/bin"
    loongarch64: "build_loongarch64/bin"
    android: "build_android/bin"

ci:
  supported_platforms:
    - x86_64
    - aarch64
    - riscv64
    - loongarch64
    - android

  build_tags:
    x86_64: "build-x86_64"
    aarch64: "build-arm64"
    riscv64: "build-x86_64"  # RISC-V uses a x86_64 builder
    loongarch64: "build-loongarch64"
    android: "build-x86_64"  # Android uses a x86_64 builder for cross-compilation

  release_branch_pattern: "/^dl-release-.*$/"

utils:
  default_platform_suffix_template: "linux-{platform}"

  error_messages:
    unsupported_platform: "Unsupported DOCKER_PLATFORM: {platform}"
    supported_platforms_info: "Supported platforms: {platforms}"

