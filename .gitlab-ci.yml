release_llama_cpp_x86_64:
  stage: release_llama_cpp_x86_64
  tags:
    - pytorch
  dependencies:
    - compile_and_test_llama_cpp_x86_64
  only:
    - /^dl-release-.*$/
  script:
    - *docker_envs
    - ${DOCKER_REPO_PATH}/bash.sh "${DOCKER_ENVS[@]}" "${DOCKER_IMAGE_X86}" ./.dlci/release_llama_cpp.sh

release_llama_cpp_aarch64:
  stage: release_llama_cpp_aarch64
  tags:
    - pytorch-aarch64
  dependencies:
    - compile_and_test_llama_cpp_aarch64
  only:
    - /^dl-release-.*$/
  script:
    - *docker_envs
    - ${DOCKER_REPO_PATH}/bash.sh "${DOCKER_ENVS[@]}" "${DOCKER_IMAGE_AARCH64}" ./.dlci/release_llama_cpp.sh

