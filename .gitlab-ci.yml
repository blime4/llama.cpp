variables:
  SDK_TAG: V2_SOFTWARE_master_202506262155
  REPO_PATH: "${CI_PROJECT_DIR}"
  LOCAL_MODEL_PATH: "/mars/aebox/LLM/model"
  SDK_WORKSPACE: "${CI_BUILDS_DIR}/sdk_llama_cpp/${SDK_TAG}"
  DOCKER_REPO_PATH: "${CI_BUILDS_DIR}/sdk_llama_cpp/docker"
  DOCKER_IMAGE_COMPILE: "ext-artifactory.denglin.com:8082/ci-docker-images/c-29:manylinux_2_28-gcc12-amd64-20250703"
  DOCKER_IMAGE_TEST: "ext-artifactory.denglin.com:8082/ci-docker-images/c-29:manylinux_2_28-gcc12-amd64-20250703"

.docker_envs: &docker_envs |
  DOCKER_ENVS=()
  while IFS='=' read -r key value; do
    DOCKER_ENVS+=(--env "${key}=${value}")
  done < <(env | grep -E '^(SDK_|CI_|sdk_|REPO_PATH|LOCAL_MODEL_PATH)')

stages:
  - compile_and_test_llama_cpp_x86_64
  - release_llama_cpp_x86_64

compile_and_test_llama_cpp_x86_64:
  stage: compile_and_test_llama_cpp_x86_64
  tags:
    - pytorch
  script:
    - git submodule sync && git submodule update --init --recursive
    - bash .dlci/download_and_unpack_sdk.sh "${SDK_TAG}" "${SDK_WORKSPACE}"
    - export sdk_path="${SDK_WORKSPACE}/sdk"
    - *docker_envs
    - ${DOCKER_REPO_PATH}/bash.sh "${DOCKER_ENVS[@]}" "${DOCKER_IMAGE_COMPILE}" ./.dlci/compile_llama_cpp.sh
    - ${DOCKER_REPO_PATH}/bash.sh "${DOCKER_ENVS[@]}" "${DOCKER_IMAGE_TEST}" ./.dlci/test_llama_cpp.sh
  artifacts:
    paths:
      - build/bin
    expire_in: 1 day

release_llama_cpp_x86_64:
  stage: release_llama_cpp_x86_64
  tags:
    - pytorch
  dependencies:
    - compile_and_test_llama_cpp_x86_64
  only:
    - /^dl-release-.*$/
  script:
    - *docker_envs
    - ${DOCKER_REPO_PATH}/bash.sh "${DOCKER_ENVS[@]}" "${DOCKER_IMAGE_TEST}" ./.dlci/release_llama_cpp.sh
  release:
    tag_name: "${CI_COMMIT_TAG}"
    name: "Release ${CI_COMMIT_TAG}"
    description: |
      Release ${CI_COMMIT_TAG}
      This release contains the following submissions:
      ${CI_PROJECT_DIR:+$(git log $(git describe --tags --abbrev=0 --match "dl-release*" HEAD^)..HEAD --pretty=format:"%s")}
    ref: "${CI_COMMIT_SHA}"
    assets:
      links:
        - name: "llama-${CI_COMMIT_TAG}-bin-ubuntu-x64.zip"
          url: "http://ext-artifactory.denglin.com:8082/artifactory/dl-pypi/llamacpp/llama-${CI_COMMIT_TAG}-bin-ubuntu-x64.zip"