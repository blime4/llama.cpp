compile_and_test_llama_cpp_loongarch64:
  stage: compile_and_test_llama_cpp
  variables:
    DOCKER_PLATFORM: loongarch64
  tags:
    - build-loongarch64
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^dl-release-.*$/'
      when: on_success
    - when: on_success
  script:
    - *load_unified_config
    - bash .dlci/download_and_unpack_sdk.sh "${SDK_TAG}" "${SDK_WORKSPACE}"
    - export SDK_DIR="${SDK_WORKSPACE}/sdk"
    - *docker_envs
    - bash ${REPO_PATH}/.dlci/check_device_status.sh
    - ${DOCKER_REPO_PATH}/bash.sh --env DOCKER_PLATFORM=${DOCKER_PLATFORM} "${DOCKER_ENVS[@]}" "${DOCKER_IMAGE_LOONGAARCH64}" ${REPO_PATH}/.dlci/compile_llama_cpp.sh
    - ${DOCKER_REPO_PATH}/bash.sh --env DOCKER_PLATFORM=${DOCKER_PLATFORM} "${DOCKER_ENVS[@]}" "${DOCKER_IMAGE_LOONGAARCH64}" ${REPO_PATH}/.dlci/test_llama_cpp.sh
    - ${DOCKER_REPO_PATH}/bash.sh --env DOCKER_PLATFORM=${DOCKER_PLATFORM} "${DOCKER_ENVS[@]}" "${DOCKER_IMAGE_LOONGAARCH64}" ${REPO_PATH}/.dlci/bench_llama_cpp.sh --ci-test --binary-path build_loongarch64/bin
  artifacts:
    paths:
      - build_loongarch64/bin
      - logs/compile/
    expire_in: 1 day
    when: always

